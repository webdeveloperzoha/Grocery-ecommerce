<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Fresh Products — zgrocery</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header id="site-header" class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="logo-leaf"><i class="fa-solid fa-leaf"></i></span>
          <span class="logo-text">z<span>grocery</span></span>
        </a>
        <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <i class="fa-solid fa-bars-staggered fs-3"></i>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="pages.html">Pages</a></li>
            <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
          <a href="order.html" class="btn btn-primary-yellow rounded-pill px-4">Order Now</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="page-hero text-center">
    <div class="container" data-aos="fade-up">
      <span class="section-tag">FRESH HARVEST STORE</span>
      <h1 class="text-white section-heading mt-2">Organic Store Catalog</h1>
      <p class="text-muted mb-0">Home / <span class="text-white">Shop</span></p>
    </div>
  </div>

  <section class="py-5">
    <div class="container py-4">
      <div class="row g-4">
        <!-- Item 1 -->
        <div class="col-6 col-md-4 col-lg-3" data-aos="fade-up">
          <div class="product-card text-center p-3 rounded-4 bg-white shadow-sm h-100 d-flex flex-column justify-content-between">
            <div class="product-thumb mb-2">
              <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=400&q=80" alt="Bananas" class="img-fluid rounded" />
            </div>
            <h6 class="product-title text-dark mb-1">Fresh Bananas</h6>
            <p class="text-success fw-bold mb-2">$18.00 / kg</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-success btn-sm rounded-pill add-to-cart-btn"><i class="fa-solid fa-cart-plus me-1"></i> Cart</button>
              <button class="btn btn-primary-yellow btn-sm rounded-pill order-item-btn" data-product="Fresh Bananas">Order Now</button>
            </div>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="col-6 col-md-4 col-lg-3" data-aos="fade-up" data-aos-delay="100">
          <div class="product-card text-center p-3 rounded-4 bg-white shadow-sm h-100 d-flex flex-column justify-content-between">
            <div class="product-thumb mb-2">
              <img src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=400&q=80" alt="Potatoes" class="img-fluid rounded" />
            </div>
            <h6 class="product-title text-dark mb-1">Farm Potatoes</h6>
            <p class="text-success fw-bold mb-2">$12.00 / kg</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-success btn-sm rounded-pill add-to-cart-btn"><i class="fa-solid fa-cart-plus me-1"></i> Cart</button>
              <button class="btn btn-primary-yellow btn-sm rounded-pill order-item-btn" data-product="Farm Potatoes">Order Now</button>
            </div>
          </div>
        </div>

        <!-- Item 3 -->
        <div class="col-6 col-md-4 col-lg-3" data-aos="fade-up" data-aos-delay="200">
          <div class="product-card text-center p-3 rounded-4 bg-white shadow-sm h-100 d-flex flex-column justify-content-between">
            <div class="product-thumb mb-2">
              <img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=400&q=80" alt="Tomatoes" class="img-fluid rounded" />
            </div>
            <h6 class="product-title text-dark mb-1">Red Tomatoes</h6>
            <p class="text-success fw-bold mb-2">$23.00 / kg</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-success btn-sm rounded-pill add-to-cart-btn"><i class="fa-solid fa-cart-plus me-1"></i> Cart</button>
              <button class="btn btn-primary-yellow btn-sm rounded-pill order-item-btn" data-product="Red Tomatoes">Order Now</button>
            </div>
          </div>
        </div>

        <!-- Item 4 -->
        <div class="col-6 col-md-4 col-lg-3" data-aos="fade-up" data-aos-delay="300">
          <div class="product-card text-center p-3 rounded-4 bg-white shadow-sm h-100 d-flex flex-column justify-content-between">
            <div class="product-thumb mb-2">
              <img src="https://images.unsplash.com/photo-1556801712-76c8eb07bbc9?auto=format&fit=crop&w=400&q=80" alt="Lettuce" class="img-fluid rounded" />
            </div>
            <h6 class="product-title text-dark mb-1">Crisp Lettuce</h6>
            <p class="text-success fw-bold mb-2">$10.00 / piece</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-success btn-sm rounded-pill add-to-cart-btn"><i class="fa-solid fa-cart-plus me-1"></i> Cart</button>
              <button class="btn btn-primary-yellow btn-sm rounded-pill order-item-btn" data-product="Crisp Lettuce">Order Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer pt-5 border-top border-dark-subtle text-center">
    <div class="container py-4"><p class="mb-0 text-muted small">&copy; 2026 zgrocery. All Rights Reserved.</p></div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
